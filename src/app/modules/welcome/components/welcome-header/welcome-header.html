<nav
  class="relative bg-gray-800/50 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10"
>
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <!-- Mobile menu button -->
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <button
          type="button"
          id="mobile-menu-button"
          data-dropdown-toggle="mobile-menu"
          aria-expanded="false"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <span class="sr-only">Open main menu</span>
          <!-- Icon para cuando está cerrado -->
          <svg
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <!-- Icon para cuando está abierto -->
          <svg
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Logo + links de escritorio -->
      <div class="flex flex-1 items-center justify-center sm:justify-start">
        <div class="flex shrink-0 items-center">
          <img src="https://jams797.com/img/viamatica.png" alt="Your Company" class="h-8 w-auto" />
        </div>
        <div class="hidden sm:ml-6 sm:block">
          <div class="flex space-x-4">
            <a
              href="#"
              aria-current="page"
              class="rounded-md px-3 py-2 text-sm font-medium text-white"
              [routerLink]="['/welcome']"
              [routerLinkActive]="['bg-gray-950/50']"
              >Home</a
            >
            <a
              href="#"
              aria-current="page"
              class="rounded-md px-3 py-2 text-sm font-medium text-white"
              >Dashboard</a
            >
            <a
              href="#"
              class="rounded-md px-3 py-2 text-sm font-medium text-white"
              [routerLink]="['/teams']"
              [routerLinkActive]="['bg-gray-950/50']"
              >Team</a
            >
            <a
              href="#"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
              >Projects</a
            >
            <a
              href="#"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
              >Calendar</a
            >
          </div>
        </div>
      </div>

      <!-- Perfil / Dropdown usuario -->
      <div
        class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0"
      >
        <button
          type="button"
          id="user-menu-button"
          data-dropdown-toggle="user-dropdown"
          class="relative rounded-lg p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <span class="sr-only">Open user menu</span>
          <div class="relative">
            <img
              class="w-10 h-10 rounded-lg cursor-pointer"
              src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
              alt=""
            />
            <span
              class="absolute flex size-3 top-1 right-1 transform -translate-y-1/2 translate-x-1/2"
            >
              <span
                class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-300 opacity-75"
              ></span>
              <span class="relative inline-flex size-3 rounded-full bg-green-500"></span>
            </span>
          </div>
        </button>
        <!-- Menú desplegable usuario -->
        <div
          id="user-dropdown"
          class="hidden origin-top-right absolute right-0 w-45 rounded-md bg-gray-800 py-1 text-gray-300 shadow-lg focus:outline-none"
          role="menu"
          aria-orientation="vertical"
          aria-labelledby="user-menu-button"
        >
          <a
            [routerLink]="['/profile']"
            [routerLinkActive]="['bg-gray-950/50']"
            class="block px-4 py-2 text-sm hover:bg-gray-700"
            role="menuitem"
            >Your profile</a
          >
          <a
            [routerLink]="['/settings']"
            [routerLinkActive]="['bg-gray-950/50']"
            class="block px-4 py-2 text-sm hover:bg-gray-700"
            role="menuitem"
            >Settings</a
          >
          <a
            [routerLink]="['/not-found']"
            class="block px-4 py-2 text-sm hover:bg-gray-700"
            role="menuitem"
            >Sign out</a
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Menú móvil (colapsable) -->
  <div
    id="mobile-menu"
    class="hidden sm:hidden bg-gray-800 rounded-md"
    aria-labelledby="mobile-menu-button"
  >
    <div class="space-y-1 px-2 pt-2 pb-3">
      <a
        href="#"
        aria-current="page"
        class="block rounded-md px-3 py-2 text-base font-medium text-white"
        [routerLink]="['/welcome']"
        [routerLinkActive]="['bg-gray-950/50']"
        >Home</a
      >
      <a
        href="#"
        aria-current="page"
        class="block rounded-md px-3 py-2 text-base font-medium text-white"
        [routerLinkActive]="['bg-gray-950/50']"
        >Dashboard</a
      >
      <a
        [routerLink]="['/teams']"
        [routerLinkActive]="['bg-gray-950/50']"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white"
        >Team</a
      >
      <a
        href="#"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white"
        >Projects</a
      >
      <a
        href="#"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white"
        >Calendar</a
      >
    </div>
  </div>
</nav>
